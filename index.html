<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, touch-action: manipulation">
  <title>Red Velvet Cake - Laddoo 💕</title>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
      }
    }
  </script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      overflow: hidden;
      font-family: 'Segoe UI', 'Poppins', cursive;
      background: radial-gradient(circle at center, #1a0a1a 0%, #0a0a14 100%);
      touch-action: manipulation;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }
    
    #ui-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 10;
    }
    
    .title {
      position: absolute;
      top: 15px;
      width: 100%;
      text-align: center;
      font-size: clamp(1.5rem, 5vw, 3rem);
      font-weight: bold;
      background: linear-gradient(45deg, #ff6b9d, #ffd700, #ff6b9d);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 15px rgba(255,107,157,0.7));
      animation: titleGlow 2s infinite alternate;
      padding: 0 10px;
    }
    
    @keyframes titleGlow {
      0% { filter: drop-shadow(0 0 10px rgba(255,107,157,0.5)); }
      100% { filter: drop-shadow(0 0 30px rgba(255,215,0,0.8)); }
    }
    
    .subtitle {
      position: absolute;
      top: 70px;
      width: 100%;
      text-align: center;
      color: #ffe0e0;
      font-size: 0.9rem;
      letter-spacing: 2px;
      padding: 0 10px;
    }
    
    .info-panel {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(20px);
      padding: 12px 18px;
      border-radius: 50px;
      color: #ffd4d4;
      font-size: 0.85rem;
      font-weight: bold;
      border: 1px solid rgba(255,150,180,0.5);
      pointer-events: all;
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      max-width: 95vw;
    }
    
    .candle-status {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(255,255,255,0.1);
      padding: 6px 14px;
      border-radius: 25px;
      font-size: 0.8rem;
    }
    
    .btn {
      border: none;
      color: white;
      padding: 8px 16px;
      border-radius: 25px;
      font-size: 0.85rem;
      cursor: pointer;
      font-weight: bold;
      pointer-events: all;
      transition: all 0.3s;
      box-shadow: 0 4px 15px rgba(255,77,109,0.4);
      white-space: nowrap;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    
    .btn:active {
      transform: scale(0.95);
    }
    
    .btn:disabled {
      opacity: 0.4;
      pointer-events: none;
    }
    
    .slice-btn {
      background: linear-gradient(135deg, #ffd700, #ff8c00);
      color: #4a0000;
    }
    
    .reset-btn {
      background: linear-gradient(135deg, #666, #444);
    }
    
    .celebration-msg {
      position: absolute;
      top: 40%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 1.5rem;
      color: white;
      text-shadow: 0 0 25px #ff6b9d;
      pointer-events: none;
      opacity: 0;
      transition: all 0.5s;
      text-align: center;
      z-index: 20;
      padding: 0 20px;
    }
    
    .celebration-msg.show {
      opacity: 1;
      animation: popIn 0.5s ease-out;
    }
    
    @keyframes popIn {
      0% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
      70% { transform: translate(-50%, -50%) scale(1.1); }
      100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
    }
    
    .slice-guide {
      position: absolute;
      pointer-events: none;
      border: 3px dashed rgba(255,215,0,0.8);
      border-radius: 50%;
      background: rgba(255,107,157,0.15);
      display: none;
      z-index: 5;
    }
    
    @media (max-width: 600px) {
      .info-panel {
        gap: 8px;
        padding: 10px 14px;
      }
      .btn {
        padding: 8px 14px;
        font-size: 0.8rem;
      }
      .candle-status {
        font-size: 0.75rem;
        padding: 5px 10px;
      }
    }
  </style>
</head>
<body>
  <div id="ui-overlay">
    <div class="title">🎂 Happy Birthday Laddoo! 🎂</div>
    <div class="subtitle">✨ Red Velvet Dream Cake ✨</div>
    
    <div class="celebration-msg" id="celebrationMsg"></div>
    
    <div class="info-panel">
      <div class="candle-status">
        <span>🕯️</span>
        <span id="candleCount">5 candles lit</span>
      </div>
      <button class="btn slice-btn" id="sliceModeBtn" disabled>🔪 Blow candles first</button>
      <button class="btn reset-btn" id="resetBtn">🔄 Reset</button>
    </div>
    
    <div class="slice-guide" id="sliceGuide"></div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

    // ============ SCENE SETUP ============
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1a0a2e);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 50);
    camera.position.set(4, 3.5, 6);
    camera.lookAt(0, 0.6, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.setClearColor(0x1a0a2e);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);

    const labelRenderer = new CSS2DRenderer();
    labelRenderer.setSize(window.innerWidth, window.innerHeight);
    labelRenderer.domElement.style.position = 'absolute';
    labelRenderer.domElement.style.top = '0';
    labelRenderer.domElement.style.pointerEvents = 'none';
    document.body.appendChild(labelRenderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.target.set(0, 0.7, 0);
    controls.maxPolarAngle = Math.PI / 2.1;
    controls.minDistance = 3.5;
    controls.maxDistance = 10;
    controls.update();
    
    // Configure controls for touch
    controls.touches = {
      ONE: THREE.TOUCH.ROTATE,
      TWO: THREE.TOUCH.DOLLY_PAN
    };

    // ============ LIGHTING ============
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);
    
    const dirLight = new THREE.DirectionalLight(0xffeedd, 1);
    dirLight.position.set(5, 8, 5);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.width = 2048;
    dirLight.shadow.mapSize.height = 2048;
    scene.add(dirLight);
    
    const pointLight1 = new THREE.PointLight(0xff8c94, 0.8, 10);
    pointLight1.position.set(-3, 3, 3);
    scene.add(pointLight1);
    
    const pointLight2 = new THREE.PointLight(0xffd700, 0.6, 8);
    pointLight2.position.set(3, 2, -2);
    scene.add(pointLight2);

    // ============ STARS ============
    const starsGeo = new THREE.BufferGeometry();
    const starsCount = 500;
    const starsPos = new Float32Array(starsCount * 3);
    for (let i = 0; i < starsCount * 3; i += 3) {
      starsPos[i] = (Math.random() - 0.5) * 25;
      starsPos[i+1] = (Math.random() - 0.5) * 15 + 5;
      starsPos[i+2] = (Math.random() - 0.5) * 20;
    }
    starsGeo.setAttribute('position', new THREE.BufferAttribute(starsPos, 3));
    const stars = new THREE.Points(starsGeo, new THREE.PointsMaterial({
      color: 0xffd4e0, size: 0.06, blending: THREE.AdditiveBlending, transparent: true, opacity: 0.8
    }));
    scene.add(stars);

    // ============ CAKE ============
    const cakeGroup = new THREE.Group();
    scene.add(cakeGroup);

    // Stand/Plate
    const standGeo = new THREE.CylinderGeometry(1.5, 1.6, 0.2, 64);
    const standMat = new THREE.MeshStandardMaterial({ 
      color: '#faf0e6', roughness: 0.3, metalness: 0.5
    });
    const stand = new THREE.Mesh(standGeo, standMat);
    stand.position.y = -0.05;
    stand.receiveShadow = true;
    stand.castShadow = true;
    cakeGroup.add(stand);

    // Gold rim
    const rimGeo = new THREE.TorusGeometry(1.55, 0.05, 16, 64);
    const rimMat = new THREE.MeshStandardMaterial({ 
      color: '#ffd700', roughness: 0.2, metalness: 0.9, emissive: new THREE.Color(0x221100)
    });
    const rim = new THREE.Mesh(rimGeo, rimMat);
    rim.rotation.x = Math.PI / 2;
    rim.position.y = 0.05;
    cakeGroup.add(rim);

    // Main cake body
    const cakeBodyGeo = new THREE.CylinderGeometry(1.3, 1.35, 0.8, 64);
    const cakeBodyMat = new THREE.MeshStandardMaterial({ 
      color: '#8B0000', roughness: 0.5, metalness: 0.1
    });
    const cakeBody = new THREE.Mesh(cakeBodyGeo, cakeBodyMat);
    cakeBody.position.y = 0.45;
    cakeBody.castShadow = true;
    cakeBody.receiveShadow = true;
    cakeBody.name = 'cakeBody';
    cakeGroup.add(cakeBody);

    // Frosting top
    const frostingTopGeo = new THREE.CylinderGeometry(1.32, 1.32, 0.1, 64);
    const frostingMat = new THREE.MeshStandardMaterial({ 
      color: '#FFF5EE', roughness: 0.3, metalness: 0.05
    });
    const frostingTop = new THREE.Mesh(frostingTopGeo, frostingMat);
    frostingTop.position.y = 0.87;
    frostingTop.castShadow = true;
    frostingTop.receiveShadow = true;
    frostingTop.name = 'frostingTop';
    cakeGroup.add(frostingTop);

    // Frosting ring
    const frostingRingGeo = new THREE.TorusGeometry(1.3, 0.07, 16, 64);
    const frostingRing = new THREE.Mesh(frostingRingGeo, frostingMat);
    frostingRing.rotation.x = Math.PI / 2;
    frostingRing.position.y = 0.9;
    frostingRing.castShadow = true;
    frostingRing.name = 'frostingRing';
    cakeGroup.add(frostingRing);

    // ============ CANDLES ============
    const candles = [];
    const flameGroups = [];
    const flameLights = [];
    
    function createCandle(x, z) {
      const candleGroup = new THREE.Group();
      
      const stickGeo = new THREE.CylinderGeometry(0.08, 0.09, 0.5, 16);
      const stickMat = new THREE.MeshStandardMaterial({ color: '#FFF0F5', roughness: 0.4 });
      const stick = new THREE.Mesh(stickGeo, stickMat);
      stick.position.y = 0.25;
      stick.castShadow = true;
      stick.name = 'candleStick';
      candleGroup.add(stick);
      
      for (let i = 0; i < 4; i++) {
        const stripeGeo = new THREE.TorusGeometry(0.085, 0.015, 8, 16);
        const stripeMat = new THREE.MeshStandardMaterial({ color: '#FFB6C1', roughness: 0.3 });
        const stripe = new THREE.Mesh(stripeGeo, stripeMat);
        stripe.rotation.x = Math.PI / 2;
        stripe.position.y = 0.1 + i * 0.12;
        candleGroup.add(stripe);
      }
      
      const wickGeo = new THREE.CylinderGeometry(0.02, 0.025, 0.1, 8);
      const wick = new THREE.Mesh(wickGeo, new THREE.MeshStandardMaterial({ color: '#2F1A0E' }));
      wick.position.y = 0.52;
      wick.name = 'wick';
      candleGroup.add(wick);
      
      const flameGroup = new THREE.Group();
      flameGroup.position.y = 0.6;
      flameGroup.name = 'flameGroup';
      
      const flameCoreGeo = new THREE.ConeGeometry(0.07, 0.2, 8);
      const flameCore = new THREE.Mesh(flameCoreGeo, new THREE.MeshStandardMaterial({ 
        color: '#FFD700', emissive: new THREE.Color('#FF8C00'), roughness: 0.2
      }));
      flameCore.name = 'flameCore';
      flameGroup.add(flameCore);
      
      const flameOuterGeo = new THREE.ConeGeometry(0.1, 0.25, 8);
      const flameOuter = new THREE.Mesh(flameOuterGeo, new THREE.MeshStandardMaterial({ 
        color: '#FFA500', emissive: new THREE.Color('#FF4500'), roughness: 0.3, transparent: true, opacity: 0.6
      }));
      flameOuter.position.y = -0.03;
      flameOuter.name = 'flameOuter';
      flameGroup.add(flameOuter);
      
      candleGroup.add(flameGroup);
      
      const light = new THREE.PointLight('#FFA500', 0.8, 3);
      light.position.y = 0.6;
      candleGroup.add(light);
      
      candleGroup.position.set(x, 0.95, z);
      
      return { group: candleGroup, flameGroup, light, isLit: true };
    }

    const radius = 0.5;
    for (let i = 0; i < 5; i++) {
      const angle = (i / 5) * Math.PI * 2 - Math.PI / 2;
      const candle = createCandle(Math.cos(angle) * radius, Math.sin(angle) * radius);
      cakeGroup.add(candle.group);
      candles.push(candle);
      flameGroups.push(candle.flameGroup);
      flameLights.push(candle.light);
    }

    // ============ NAME LABEL ============
    const nameDiv = document.createElement('div');
    nameDiv.textContent = 'Laddoo';
    nameDiv.style.fontSize = '32px';
    nameDiv.style.fontWeight = 'bold';
    nameDiv.style.color = '#FFF';
    nameDiv.style.textShadow = '0 0 20px #FF6B9D, 0 0 40px #FFD700';
    nameDiv.style.fontFamily = "'Poppins', cursive";
    nameDiv.style.letterSpacing = '4px';
    const nameLabel = new CSS2DObject(nameDiv);
    nameLabel.position.set(0, 1.5, 1.2);
    cakeGroup.add(nameLabel);

    ['❤️', '💕', '💗', '💖', '💝'].forEach((emoji, i) => {
      const div = document.createElement('div');
      div.textContent = emoji;
      div.style.fontSize = '20px';
      const label = new CSS2DObject(div);
      const angle = (i / 5) * Math.PI * 2;
      label.position.set(Math.cos(angle) * 1.2, 1.1, Math.sin(angle) * 1.0);
      cakeGroup.add(label);
    });

    // ============ INTERACTION ============
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    let sliceModeActive = false;
    let isDragging = false;
    let dragStart = null;
    let dragStart3D = null;
    let sliceCount = 0;
    
    function updateUI() {
      const litCount = candles.filter(c => c.isLit).length;
      document.getElementById('candleCount').textContent = `${litCount} candle${litCount !== 1 ? 's' : ''} lit`;
      
      const sliceBtn = document.getElementById('sliceModeBtn');
      if (litCount === 0 && !sliceModeActive) {
        sliceBtn.disabled = false;
        sliceBtn.textContent = '🔪 Slice the Cake!';
        sliceBtn.style.background = 'linear-gradient(135deg, #ffd700, #ff6b00)';
      } else if (litCount > 0 && !sliceModeActive) {
        sliceBtn.disabled = true;
        sliceBtn.textContent = '🔪 Blow candles first';
        sliceBtn.style.background = 'linear-gradient(135deg, #ffd700, #ff8c00)';
      }
    }
    
    function getIntersection(clientX, clientY) {
      const rect = renderer.domElement.getBoundingClientRect();
      mouse.x = ((clientX - rect.left) / rect.width) * 2 - 1;
      mouse.y = -((clientY - rect.top) / rect.height) * 2 + 1;
      
      raycaster.setFromCamera(mouse, camera);
      
      // Get all candle objects
      const allObjects = [];
      candles.forEach(candle => {
        candle.group.traverse(child => {
          if (child.isMesh) allObjects.push(child);
        });
      });
      
      // Also check cake for slicing
      const cakeObjects = [cakeBody, frostingTop];
      
      return {
        candles: raycaster.intersectObjects(allObjects),
        cake: raycaster.intersectObjects(cakeObjects, false)
      };
    }
    
    function handleInteraction(clientX, clientY, isTouch = false) {
      if (sliceModeActive && isDragging) return;
      
      const intersections = getIntersection(clientX, clientY);
      
      // Check candle clicks
      if (!sliceModeActive && intersections.candles.length > 0) {
        let obj = intersections.candles[0].object;
        
        for (let candle of candles) {
          let parent = obj;
          while (parent) {
            if (parent === candle.group && candle.isLit) {
              blowOutCandle(candle);
              return true;
            }
            parent = parent.parent;
          }
        }
      }
      
      return false;
    }
    
    function blowOutCandle(candle) {
      candle.isLit = false;
      candle.flameGroup.visible = false;
      candle.light.intensity = 0;
      
      const pos = candle.group.position.clone();
      pos.y += 1.5;
      createSmoke(pos);
      
      updateUI();
      
      if (candles.filter(c => c.isLit).length === 0) {
        showMessage('🎉 All candles blown! Time to slice! 🔪');
      }
    }
    
    function createSmoke(position) {
      for (let i = 0; i < 10; i++) {
        const geo = new THREE.SphereGeometry(0.03, 4, 4);
        const mat = new THREE.MeshBasicMaterial({ color: '#cccccc', transparent: true, opacity: 0.6 });
        const particle = new THREE.Mesh(geo, mat);
        particle.position.copy(position);
        particle.position.x += (Math.random() - 0.5) * 0.3;
        particle.position.z += (Math.random() - 0.5) * 0.3;
        
        const vel = new THREE.Vector3(
          (Math.random() - 0.5) * 0.01,
          Math.random() * 0.02 + 0.01,
          (Math.random() - 0.5) * 0.01
        );
        
        scene.add(particle);
        
        let life = 1;
        function animate() {
          life -= 0.02;
          particle.position.add(vel);
          particle.material.opacity = life * 0.6;
          particle.scale.multiplyScalar(1.02);
          if (life > 0) requestAnimationFrame(animate);
          else scene.remove(particle);
        }
        animate();
      }
    }
    
    function getCakePoint(clientX, clientY) {
      const rect = renderer.domElement.getBoundingClientRect();
      mouse.x = ((clientX - rect.left) / rect.width) * 2 - 1;
      mouse.y = -((clientY - rect.top) / rect.height) * 2 + 1;
      
      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects([cakeBody, frostingTop], false);
      
      if (intersects.length > 0) {
        return intersects[0].point.clone();
      }
      return null;
    }

    // ============ MOUSE EVENTS ============
    renderer.domElement.addEventListener('mousedown', (event) => {
      if (!sliceModeActive) {
        handleInteraction(event.clientX, event.clientY);
        return;
      }
      
      if (event.button !== 0) return;
      
      const point = getCakePoint(event.clientX, event.clientY);
      if (point) {
        isDragging = true;
        dragStart = { x: event.clientX, y: event.clientY };
        dragStart3D = point;
        
        document.getElementById('sliceGuide').style.display = 'block';
        document.getElementById('sliceGuide').style.left = (event.clientX - 40) + 'px';
        document.getElementById('sliceGuide').style.top = (event.clientY - 40) + 'px';
        document.getElementById('sliceGuide').style.width = '80px';
        document.getElementById('sliceGuide').style.height = '80px';
      }
    });
    
    window.addEventListener('mousemove', (event) => {
      if (!isDragging || !sliceModeActive) return;
      
      const guide = document.getElementById('sliceGuide');
      guide.style.left = Math.min(dragStart.x, event.clientX) - 30 + 'px';
      guide.style.top = Math.min(dragStart.y, event.clientY) - 30 + 'px';
      guide.style.width = Math.abs(event.clientX - dragStart.x) + 60 + 'px';
      guide.style.height = Math.abs(event.clientY - dragStart.y) + 60 + 'px';
    });
    
    window.addEventListener('mouseup', (event) => {
      if (!isDragging || !sliceModeActive) {
        isDragging = false;
        return;
      }
      
      isDragging = false;
      document.getElementById('sliceGuide').style.display = 'none';
      
      const dist = Math.sqrt(
        Math.pow(event.clientX - dragStart.x, 2) + 
        Math.pow(event.clientY - dragStart.y, 2)
      );
      
      if (dist > 40) {
        const endPoint = getCakePoint(event.clientX, event.clientY);
        if (endPoint && dragStart3D) {
          sliceCount++;
          createFlyingSlice(dragStart3D, endPoint);
          createCutLine(dragStart3D, endPoint);
          createParticles(dragStart3D, endPoint);
          showMessage(`🍰 Slice #${sliceCount} for Laddoo! 💕`);
          
          if (sliceCount >= 3) {
            sliceModeActive = false;
            document.getElementById('sliceModeBtn').textContent = '🎂 Enjoy!';
            document.getElementById('sliceModeBtn').disabled = true;
            renderer.domElement.style.cursor = 'default';
            controls.enabled = true;
          }
        }
      }
    });

    // ============ TOUCH EVENTS FOR MOBILE ============
    renderer.domElement.addEventListener('touchstart', (event) => {
      if (event.touches.length === 1) {
        const touch = event.touches[0];
        
        // Try to blow candle first
        const handled = handleInteraction(touch.clientX, touch.clientY, true);
        
        if (!handled && sliceModeActive) {
          // Start slice
          const point = getCakePoint(touch.clientX, touch.clientY);
          if (point) {
            isDragging = true;
            dragStart = { x: touch.clientX, y: touch.clientY };
            dragStart3D = point;
            
            document.getElementById('sliceGuide').style.display = 'block';
            document.getElementById('sliceGuide').style.left = (touch.clientX - 40) + 'px';
            document.getElementById('sliceGuide').style.top = (touch.clientY - 40) + 'px';
            document.getElementById('sliceGuide').style.width = '80px';
            document.getElementById('sliceGuide').style.height = '80px';
          }
        }
      }
    }, { passive: false });
    
    renderer.domElement.addEventListener('touchmove', (event) => {
      if (!isDragging || !sliceModeActive || event.touches.length !== 1) return;
      event.preventDefault();
      
      const touch = event.touches[0];
      const guide = document.getElementById('sliceGuide');
      guide.style.left = Math.min(dragStart.x, touch.clientX) - 30 + 'px';
      guide.style.top = Math.min(dragStart.y, touch.clientY) - 30 + 'px';
      guide.style.width = Math.abs(touch.clientX - dragStart.x) + 60 + 'px';
      guide.style.height = Math.abs(touch.clientY - dragStart.y) + 60 + 'px';
    }, { passive: false });
    
    renderer.domElement.addEventListener('touchend', (event) => {
      if (!isDragging || !sliceModeActive) {
        isDragging = false;
        return;
      }
      
      isDragging = false;
      document.getElementById('sliceGuide').style.display = 'none';
      
      const touch = event.changedTouches[0];
      const dist = Math.sqrt(
        Math.pow(touch.clientX - dragStart.x, 2) + 
        Math.pow(touch.clientY - dragStart.y, 2)
      );
      
      if (dist > 40) {
        const endPoint = getCakePoint(touch.clientX, touch.clientY);
        if (endPoint && dragStart3D) {
          sliceCount++;
          createFlyingSlice(dragStart3D, endPoint);
          createCutLine(dragStart3D, endPoint);
          createParticles(dragStart3D, endPoint);
          showMessage(`🍰 Slice #${sliceCount} for Laddoo! 💕`);
          
          if (sliceCount >= 3) {
            sliceModeActive = false;
            document.getElementById('sliceModeBtn').textContent = '🎂 Enjoy!';
            document.getElementById('sliceModeBtn').disabled = true;
            renderer.domElement.style.cursor = 'default';
            controls.enabled = true;
          }
        }
      }
    });

    // ============ SLICE MODE BUTTON ============
    document.getElementById('sliceModeBtn').addEventListener('click', (e) => {
      e.stopPropagation();
      if (candles.filter(c => c.isLit).length > 0) return;
      
      sliceModeActive = !sliceModeActive;
      const btn = document.getElementById('sliceModeBtn');
      
      if (sliceModeActive) {
        btn.textContent = '🔪 Slice ON - Drag on cake';
        btn.style.background = 'linear-gradient(135deg, #00cc44, #008800)';
        controls.enabled = false;
      } else {
        btn.textContent = '🔪 Slice the Cake!';
        btn.style.background = 'linear-gradient(135deg, #ffd700, #ff6b00)';
        controls.enabled = true;
      }
    });
    
    // Touch event for button
    document.getElementById('sliceModeBtn').addEventListener('touchstart', (e) => {
      e.stopPropagation();
      e.preventDefault();
      document.getElementById('sliceModeBtn').click();
    });

    // ============ CREATE SLICE ============
    function createFlyingSlice(p1, p2) {
      const center = new THREE.Vector3(0, 0.45, 0);
      const d1 = new THREE.Vector3().subVectors(p1, center).normalize();
      const d2 = new THREE.Vector3().subVectors(p2, center).normalize();
      const midAngle = Math.atan2((d1.z + d2.z)/2, (d1.x + d2.x)/2);
      
      const shape = new THREE.Shape();
      const r = 1.3;
      const a1 = Math.atan2(d1.z, d1.x);
      const a2 = Math.atan2(d2.z, d2.x);
      
      shape.moveTo(0, 0);
      for (let i = 0; i <= 24; i++) {
        const angle = a1 + (a2 - a1) * (i/24);
        shape.lineTo(Math.cos(angle) * r, Math.sin(angle) * r);
      }
      shape.closePath();
      
      const geo = new THREE.ExtrudeGeometry(shape, {
        steps: 1, depth: 0.7, bevelEnabled: true,
        bevelThickness: 0.03, bevelSize: 0.03, bevelSegments: 3
      });
      
      const slice = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({
        color: '#8B0000', roughness: 0.5, metalness: 0.1
      }));
      slice.rotation.x = -Math.PI/2;
      slice.castShadow = true;
      
      const group = new THREE.Group();
      group.add(slice);
      group.position.set(Math.cos(midAngle) * 2, 0.5, Math.sin(midAngle) * 2 - 1);
      
      scene.add(group);
      
      let progress = 0;
      function animate() {
        progress += 0.01;
        group.position.y += 0.02;
        group.position.z -= 0.02;
        group.rotation.y += 0.03;
        
        if (progress < 2) {
          requestAnimationFrame(animate);
        } else {
          let fade = 0;
          function fadeOut() {
            fade += 0.05;
            group.children.forEach(c => {
              if (c.material) {
                c.material.transparent = true;
                c.material.opacity = 1 - fade;
              }
            });
            if (fade < 1) requestAnimationFrame(fadeOut);
            else scene.remove(group);
          }
          fadeOut();
        }
      }
      animate();
    }
    
    function createCutLine(p1, p2) {
      const points = [
        p1.clone().add(new THREE.Vector3(0, 0.02, 0)),
        p2.clone().add(new THREE.Vector3(0, 0.02, 0))
      ];
      const geo = new THREE.BufferGeometry().setFromPoints(points);
      const line = new THREE.Line(geo, new THREE.LineBasicMaterial({
        color: '#FFD700', transparent: true, opacity: 0.8
      }));
      cakeGroup.add(line);
      
      let fade = 0;
      function fadeLine() {
        fade += 0.02;
        line.material.opacity = 0.8 - fade;
        if (fade < 0.8) requestAnimationFrame(fadeLine);
        else cakeGroup.remove(line);
      }
      setTimeout(() => fadeLine(), 300);
    }
    
    function createParticles(p1, p2) {
      const mid = new THREE.Vector3().addVectors(p1, p2).multiplyScalar(0.5);
      for (let i = 0; i < 20; i++) {
        const geo = new THREE.SphereGeometry(0.04, 4, 4);
        const mat = new THREE.MeshStandardMaterial({
          color: Math.random() > 0.5 ? '#FF6B9D' : '#FFD700',
          emissive: new THREE.Color(0x331100)
        });
        const particle = new THREE.Mesh(geo, mat);
        particle.position.copy(mid).add(new THREE.Vector3(
          (Math.random()-0.5)*0.5, (Math.random()-0.5)*0.3, (Math.random()-0.5)*0.5
        ));
        
        const vel = new THREE.Vector3(
          (Math.random()-0.5)*0.04, Math.random()*0.05, (Math.random()-0.5)*0.04
        );
        
        scene.add(particle);
        
        let life = 1.5;
        function animate() {
          life -= 0.03;
          particle.position.add(vel);
          vel.y -= 0.001;
          if (life > 0) requestAnimationFrame(animate);
          else scene.remove(particle);
        }
        animate();
      }
    }
    
    function showMessage(msg) {
      const el = document.getElementById('celebrationMsg');
      el.textContent = msg;
      el.classList.add('show');
      setTimeout(() => el.classList.remove('show'), 2500);
    }

    // ============ RESET ============
    document.getElementById('resetBtn').addEventListener('click', (e) => {
      e.stopPropagation();
      resetCake();
    });
    
    document.getElementById('resetBtn').addEventListener('touchstart', (e) => {
      e.stopPropagation();
      e.preventDefault();
      resetCake();
    });
    
    function resetCake() {
      candles.forEach(c => {
        c.isLit = true;
        c.flameGroup.visible = true;
        c.light.intensity = 0.8;
      });
      
      sliceModeActive = false;
      sliceCount = 0;
      document.getElementById('sliceModeBtn').disabled = true;
      document.getElementById('sliceModeBtn').textContent = '🔪 Blow candles first';
      document.getElementById('sliceModeBtn').style.background = 'linear-gradient(135deg, #ffd700, #ff8c00)';
      controls.enabled = true;
      
      const toRemove = [];
      scene.traverse(child => {
        if (child.isGroup && child !== cakeGroup && child.parent === scene && child.children.length > 0) {
          toRemove.push(child);
        }
        if (child.isLine && child.parent === cakeGroup) {
          toRemove.push(child);
        }
      });
      toRemove.forEach(obj => {
        if (obj.parent) obj.parent.remove(obj);
      });
      
      updateUI();
    }
    
    updateUI();

    // ============ ANIMATION ============
    function animate() {
      requestAnimationFrame(animate);
      
      stars.rotation.y += 0.0003;
      
      flameGroups.forEach((flame, i) => {
        if (flame.visible) {
          const s = 0.85 + Math.sin(Date.now()*0.02 + i)*0.2;
          flame.scale.set(s, s, s);
          if (flameLights[i]) {
            flameLights[i].intensity = 0.6 + Math.sin(Date.now()*0.03 + i)*0.3;
          }
        }
      });
      
      controls.update();
      renderer.render(scene, camera);
      labelRenderer.render(scene, camera);
    }
    
    animate();
    
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      labelRenderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
